<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flipbook</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #E8E0D3; }
  #book { position: fixed; inset: 0; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font: 300 15px/1.6 'Jost', sans-serif; letter-spacing: .04em; color: #6A6154; }
</style>
</head>
<body>
<div id="book"></div>
<div id="msg">Opening the book…</div>
<script type="module">
import { buildBook, createViewer } from './flipbook.js';

// Data comes one of three ways: injected as window.__FLIP_DATA
// ({ project, phase, contact }) — local tests; ?share=<token> — the public,
// no-sign-in link a client is sent (read from the same shares/{token}
// mirror as their review link, so it shows that link's phase); or
// ?project=<id>&phase=concept|design, read live as the signed-in user.
const q = new URLSearchParams(location.search);
const msg = document.getElementById('msg');

async function loadData() {
  if (window.__FLIP_DATA) return window.__FLIP_DATA;
  const api = await import('./platform-data.js');
  await api.init();
  const token = q.get('share');
  if (token) {
    const found = await api.findByShare(token);
    if (!found) throw new Error('This link is no longer available.');
    return { project: found.project, contact: found.contact || api.STUDIO_CONTACT_DEFAULT(), phase: found.share.phase === 'design' ? 'design' : 'concept' };
  }
  const user = await new Promise((res) => api.onAuth((u) => res(u)));
  if (!user) throw new Error('Sign in to the studio platform in this browser first.');
  const project = await api.getProject(q.get('project') || '86-residence');
  if (!project) throw new Error('Project not found.');
  const contact = await api.getStudioContact().catch(() => api.STUDIO_CONTACT_DEFAULT());
  return { project, contact, phase: q.get('phase') || 'concept' };
}

try {
  const data = await loadData();
  const book = await buildBook(data.project, { phase: data.phase, contact: data.contact });
  document.title = `${data.project.name || 'Project'} · Flipbook`;
  await (document.fonts ? document.fonts.ready : null);
  window.__viewer = createViewer(document.getElementById('book'), book);
  msg.remove();
  window.__flipReady = true;
} catch (err) {
  msg.textContent = (err && err.message) || String(err);
  window.__flipError = msg.textContent;
}
</script>
</body>
</html>
